# =============================================================================
# Karl (MOVA Z60 Ultra Roller) – Reinigung nach Kalender "Haushalt" + Override
# Stand: 2026-10-22, v2 live in HA (UI-Speicher, per ha-mcp eingespielt);
#   seit 2026-10-22 wischt Karl bei "Saugen & Wischen" und "Intensiv" erst nach dem Saugen
#
# Live:
#   input_boolean.karl_automatik            Kalender-Automatik an/aus
#   input_datetime.mova_letzte_auto_reinigung  "heute gereinigt" (setzt das Skript)
#   script.haushalt_mova_reinigung_starten  Modus + Räume (leer = überall)
#   automation.haushalt_karl_reinigung_bei_abwesenheit
#       alle 10 min weg -> Ansage auf Echo Wohnzimmer/Schlafzimmer/Büro,
#       5 min warten, starten, falls noch alle weg und heute nicht gereinigt
#       (auch nicht per App, sensor.…_cleaning_history)
#   automation.haushalt_mova_reinigung_bei_abwesenheit  (v1) DEAKTIVIERT, nicht gelöscht
#
# Nicht als Package nach /config/packages legen (doppelte IDs).
# Dashboard-Karten: docs/mova_entitaeten.md
# =============================================================================

input_boolean:
  karl_automatik:
    name: "Karl Automatik"
    icon: mdi:robot-vacuum
    initial: true   # nur beim Package; als UI-Helper einfach "an" anlegen

input_datetime:
  mova_letzte_auto_reinigung:      # aus v1, bleibt
    name: "Mova letzte Auto-Reinigung"
    has_date: true
    has_time: false
    icon: mdi:robot-vacuum

script:
  haushalt_mova_reinigung_starten:
    alias: "Karl – Reinigung starten"
    description: >-
      Stellt bei Karl Reinigungsart, Saugstärke, Route und Feuchte passend zum Modus
      ein und reinigt die ganze Wohnung oder nur die gewählten Räume.
    icon: mdi:robot-vacuum
    mode: single
    fields:
      modus:
        name: Modus
        required: true
        default: saugen
        selector:
          select:
            options:
              - label: "Saugen"
                value: saugen
              - label: "Saugen & Wischen"
                value: saugen_wischen
              - label: "Intensiv saugen & wischen"
                value: intensiv
      raeume:
        name: Räume
        description: "Leer lassen = überall"
        required: false
        selector:
          select:
            multiple: true
            options:
              - label: Wohnzimmer
                value: "1"
              - label: Esszimmer
                value: "4"
              - label: Küche
                value: "8"
              - label: Flur
                value: "5"
              - label: Bad
                value: "2"
              - label: Schlafzimmer
                value: "6"
              - label: Arbeitszimmer
                value: "7"
    variables:
      robi: vacuum.z60_ultra_roller_standalone
      ent_reinigungsart: select.z60_ultra_roller_standalone_cleaning_mode
      ent_saugstaerke: select.z60_ultra_roller_standalone_suction_level
      ent_route: select.z60_ultra_roller_standalone_cleaning_route
      ent_feuchte: number.z60_ultra_roller_standalone_wetness_level
      ent_individuell: switch.z60_ultra_roller_standalone_customized_cleaning
      profile:
        saugen:         {reinigungsart: "sweeping",             saugstaerke: "standard", stufe: 1, route: "standard",  feuchte: null}
        saugen_wischen: {reinigungsart: "mopping_after_sweeping", saugstaerke: "standard", stufe: 1, route: "standard",  feuchte: 16}
        intensiv:       {reinigungsart: "mopping_after_sweeping", saugstaerke: "turbo",    stufe: 3, route: "intensive", feuchte: 22}
      p: "{{ profile[modus] }}"
      segmente: >-
        {{ (raeume if raeume is defined and raeume else []) | map('int') | list }}

    sequence:
      - condition: template
        value_template: "{{ states(robi) in ['docked', 'idle'] }}"
        alias: "Karl bereit (docked/idle)"

      - if:
          - condition: template
            value_template: "{{ is_state(ent_individuell, 'on') }}"
        then:
          - action: switch.turn_off
            target: {entity_id: "{{ ent_individuell }}"}
          - delay: "00:00:03"

      - action: select.select_option
        target: {entity_id: "{{ ent_reinigungsart }}"}
        data: {option: "{{ p.reinigungsart }}"}
      - action: select.select_option
        target: {entity_id: "{{ ent_saugstaerke }}"}
        data: {option: "{{ p.saugstaerke }}"}
      - action: select.select_option
        target: {entity_id: "{{ ent_route }}"}
        data: {option: "{{ p.route }}"}

      - if:
          - condition: template
            value_template: "{{ p.feuchte is not none }}"
        then:
          - wait_template: "{{ states(ent_feuchte) not in ['unknown', 'unavailable'] }}"
            timeout: "00:00:30"
            continue_on_timeout: true
          - action: number.set_value
            target: {entity_id: "{{ ent_feuchte }}"}
            data: {value: "{{ p.feuchte }}"}
            continue_on_error: true

      - delay: "00:00:05"

      # überall oder nur die gewählten Räume
      - if:
          - condition: template
            value_template: "{{ segmente | count == 0 }}"
        then:
          - action: vacuum.start
            target: {entity_id: "{{ robi }}"}
        else:
          - action: dreame_vacuum.vacuum_clean_segment
            target: {entity_id: "{{ robi }}"}
            data:
              segments: "{{ segmente }}"
              suction_level: "{{ p.stufe }}"   # 0 quiet … 3 turbo
              repeats: 1

      # merken, dass heute gereinigt wurde (egal ob Automatik oder Dashboard)
      - action: input_datetime.set_datetime
        target: {entity_id: input_datetime.mova_letzte_auto_reinigung}
        data: {date: "{{ now().date() }}"}

automation:
  - id: haushalt_karl_reinigung_bei_abwesenheit
    alias: "Haushalt – Karl Reinigung bei Abwesenheit"
    description: >-
      Wenn an Wochentagen alle weg sind, sagt Karl laut Kalender "Haushalt" über die
      Echos an, was er vorhat, wartet 5 Minuten und startet dann, falls noch niemand
      zurück ist und heute noch nicht gereinigt wurde (auch nicht per App).
    mode: single
    triggers:
      - trigger: state
        entity_id: zone.home
        to: "0"
        for: "00:10:00"
    conditions:
      - condition: state
        entity_id: input_boolean.karl_automatik
        state: "on"
      - condition: time
        weekday: [mon, tue, wed, thu, fri]
        after: "07:00:00"
        before: "17:00:00"
      - condition: state
        entity_id: vacuum.z60_ultra_roller_standalone
        state: docked
      - alias: "Heute noch nicht gereinigt (Automatik, Dashboard oder App)"
        condition: template
        value_template: >-
          {% set h = states('sensor.z60_ultra_roller_standalone_cleaning_history') %}
          {% set app_heute = h not in ['unknown', 'unavailable', 'none', '']
                             and as_local(as_datetime(h)).date() == now().date() %}
          {{ not app_heute
             and states('input_datetime.mova_letzte_auto_reinigung') != now().date() | string }}

    actions:
      - action: calendar.get_events
        target: {entity_id: calendar.haushalt}
        data:
          start_date_time: "{{ today_at('00:00') }}"
          end_date_time: "{{ today_at('23:59') }}"
        response_variable: kalender

      - variables:
          titel: >-
            {{ kalender['calendar.haushalt'].events | map(attribute='summary')
               | map('lower') | map('trim') | list }}
          modus: >-
            {%- if 'intensiv saugen & wischen' in titel -%}intensiv
            {%- elif 'saugen & wischen' in titel -%}saugen_wischen
            {%- elif 'saugen' in titel -%}saugen
            {%- else -%}keiner{%- endif -%}
          art:
            saugen: "Das Saugen"
            saugen_wischen: "Das Saugen und Wischen"
            intensiv: "Die Intensivreinigung"
          art_titel:
            saugen: "Saugen"
            saugen_wischen: "Saugen & Wischen"
            intensiv: "Intensiv saugen & wischen"
          echos:
            media_player.echo_wohnzimmer: switch.echo_wohnzimmer_bitte_nicht_storen_2
            media_player.echo_schlafzimmer: switch.echo_schlafzimmer_bitte_nicht_storen_2
            media_player.echo_dot_buro: switch.echo_dot_buro_bitte_nicht_storen_2
          ziele: >-
            {% set ns = namespace(z=[]) %}
            {% for mp, dnd in echos.items() if not is_state(dnd, 'on') and not is_state(mp, 'unavailable') %}
            {% set ns.z = ns.z + [mp] %}
            {% endfor %}
            {{ ns.z }}

      - condition: template
        value_template: "{{ modus != 'keiner' }}"
        alias: "Heute steht eine Reinigung im Kalender"

      # Ansage – bewusst auch, wenn laut HA niemand da ist; Echos mit "Bitte nicht stören" werden übersprungen
      - if:
          - condition: template
            value_template: "{{ ziele | count > 0 }}"
        then:
          - action: notify.alexa_media
            data:
              target: "{{ ziele }}"
              message: >-
                Entschuldigung, dass ich störe. {{ art[modus] }}
                startet in fünf Minuten.
              data:
                type: announce
            continue_on_error: true

      - delay: "00:05:00"

      # wer in den 5 Minuten heimkommt, bremst Karl aus
      - condition: state
        entity_id: zone.home
        state: "0"
        alias: "Immer noch alle weg"
      - condition: state
        entity_id: vacuum.z60_ultra_roller_standalone
        state: docked

      - action: script.haushalt_mova_reinigung_starten
        data:
          modus: "{{ modus }}"

      - action: persistent_notification.create
        data:
          notification_id: mova_auto_reinigung
          title: "Karl ist losgefahren"
          message: >-
            Alle sind weg – „{{ art_titel[modus] }}“ laut Kalender Haushalt
            um {{ now().strftime('%H:%M') }} gestartet.
