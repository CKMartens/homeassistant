# =============================================================================
# Auto-Stellplätze – "Auto ist zu Hause" für Neonplan3D
# Stand: 2026-10-18, live in HA als UI-Template-Helfer (per ha-mcp, Backup 58624577 vorher)
#   binary_sensor.auto_capri_zuhause
#   binary_sensor.auto_mg_zuhause
#   binary_sensor.auto_capri_eingesteckt (Backup 7993cbfa vorher)
#
# Nutzung:
#   a) als Package: Datei nach /config/packages/ legen
#      (configuration.yaml: homeassistant: packages: !include_dir_named packages)
#   b) oder als UI-Helper: Einstellungen → Geräte & Dienste → Helfer →
#      Template → Binärsensor, Zustandsvorlage aus "state" unten kopieren,
#      Geräteklasse "Anwesenheit"
#
# Idee: keine externen Sensoren. Jedes Auto meldet seine GPS-Position über die
#   Hersteller-Integration (FordPass bzw. MG iSMART). Steht der Tracker auf
#   "home" (zone.home, Radius 200 m), steht das Auto zu Hause. Ist der Tracker
#   unavailable/unknown, wird auch der Sensor unavailable, statt fälschlich
#   "weg" zu melden.
#   2026-10-20: ABRP-Tracker entfernt, die blieben immer auf "home" stehen
#   (Capri stand in Kronach und galt als zu Hause). Backup 55af07ce vorher.
#   Details: docs/auto_stellplaetze.md
# =============================================================================

template:
  - binary_sensor:
      - name: "Auto Capri zuhause"
        unique_id: auto_capri_zuhause
        device_class: presence
        icon: mdi:car-electric
        state: >-
          {{ is_state('device_tracker.fordpass_wf0spbef1tsd01110_tracker', 'home') }}
        availability: >-
          {{ states('device_tracker.fordpass_wf0spbef1tsd01110_tracker') not in ['unknown', 'unavailable'] }}

      - name: "Auto MG zuhause"
        unique_id: auto_mg_zuhause
        device_class: presence
        icon: mdi:car-electric
        state: >-
          {{ is_state('device_tracker.mg_mgs5_ev_gps_location', 'home') }}
        availability: >-
          {{ states('device_tracker.mg_mgs5_ev_gps_location') not in ['unknown', 'unavailable'] }}

      - name: "Auto Capri eingesteckt"
        unique_id: auto_capri_eingesteckt
        device_class: plug
        icon: mdi:ev-plug-type2
        state: >-
          {{ is_state('sensor.fordpass_wf0spbef1tsd01110_elvehplug', 'CONNECTED') }}
        availability: >-
          {{ states('sensor.fordpass_wf0spbef1tsd01110_elvehplug')
             not in ['unknown', 'unavailable'] }}
