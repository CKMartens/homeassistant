# =============================================================================
# Weihnachtsbeleuchtung – Zeitplan
# Stand: 2026-11-28, live in HA als UI-Automation und UI-Helfer:
#   automation.weihnachtsbeleuchtung_zeitplan (UI-id weihnachtsbeleuchtung_zeitplan)
#   input_boolean.weihnachtsbeleuchtung_automatik (UI-Helfer, Schalter für die Saison)
#   Label "Weihnachtsbeleuchtung" (label_id weihnachtsbeleuchtung)
#
# Nutzung: In der UI eine neue Automation anlegen, "In YAML bearbeiten" und den
#   Block unter automation: (ohne das führende "- ") einfügen. Helfer und Label in
#   der UI anlegen. NICHT zusätzlich nach /config/packages/ legen, sonst läuft die
#   Automation doppelt.
#
# Was geschaltet wird: alles mit dem Label "Weihnachtsbeleuchtung", derzeit
#   switch.kuche_weihnachtsdeko_fenster, switch.essbereich_weihnachtsdeko_fenster
#   (Z2M-Steckdosen). Weitere Lichter oder
#   Steckdosen: nur das Label vergeben, an der Automation ändert sich nichts.
#   homeassistant.turn_on/turn_off schaltet light und switch gemischt.
#   Den Automatik-Schalter NICHT labeln, sonst schaltet die Automation ihn selbst aus.
#
# AUSSEN (seit 2026-11-28): light.h702a (Govee Gartenlicht) trägt stattdessen das
#   Label "Weihnachtsbeleuchtung außen" (label_id weihnachtsbeleuchtung_aussen) und
#   läuft über automation.weihnachtsbeleuchtung_aussen_dunkelheit: jeden Tag gleich
#   05:00–22:00, aber nur wenn binary_sensor.garten_dunkel an ist (Threshold-Helfer
#   "Garten dunkel" auf sensor.hmip_slo_000d60c9a905f8_hochste_beleuchtungsstarke,
#   lower 325 lx, Hysterese 25: an unter 300 lx, aus über 350 lx (seit 28.11. nachmittags, vorher 30/70 lx zu spät), je 5 min stabil).
#   Fällt der Lichtsensor aus, gilt sun.sun below_horizon. Das Gartenlicht selbst
#   hebt den Sensor nachts nur auf ca. 0,6 lx, also keine Rückkopplung.
#   Weitere Außenbeleuchtung (z. B. am Brunnen-Stecker switch.garten_garten_brunnen):
#   Label "Weihnachtsbeleuchtung außen" vergeben und automation.brunnen_einschalten
#   aus lassen, sonst schaltet die Bewegung den Stecker nach 1 h wieder ab.
#
# Zeitplan (innen):
#   Werktag (binary_sensor.workday_sensor = on, Bayern, Feiertage ausgenommen):
#     an 05:00 bis Sonnenaufgang + 1 h, an Sonnenuntergang − 2 h bis 22:00
#   Wochenende und Feiertag (workday = off): an 05:00 bis 22:00
#
# Randfälle: Die Logik prüft immer "Uhrzeit 05:00–22:00 UND (frei ODER vor
#   Sonnenaufgang+1h ODER nach Sonnenuntergang−2h)". Liegt Sonnenaufgang+1h vor
#   05:00, ist das Morgenfenster leer und fällt einfach aus; liegt
#   Sonnenuntergang−2h nach 22:00, entfällt das Abendfenster. Kein Doppelschalten.
#
# Neustart: Jeder Trigger rechnet nur den Soll-Zustand neu aus und setzt ihn. Nach
#   dem HA-Start wartet sie 1 min (Zigbee2MQTT/Govee), dann holt sie verpasste
#   Schaltzeiten nach. Beim Einschalten der Automatik ebenso. Bewusst kein Trigger
#   auf den Workday-Wechsel um Mitternacht, damit ein Handschalten nach 22:00 nicht
#   um 00:00 überfahren wird.
# =============================================================================
input_boolean:
  weihnachtsbeleuchtung_automatik:
    name: Weihnachtsbeleuchtung Automatik
    icon: mdi:pine-tree

automation:
  - id: weihnachtsbeleuchtung_zeitplan
    alias: Weihnachtsbeleuchtung – Zeitplan
    description: >-
      Schaltet alles mit dem Label „Weihnachtsbeleuchtung“ nach Zeitplan: an
      Werktagen 05:00 bis Sonnenaufgang+1h und Sonnenuntergang−2h bis 22:00, an
      Wochenenden und Feiertagen (Workday Sensor, Bayern) 05:00 bis 22:00. Bei jedem
      Schaltzeitpunkt, nach dem HA-Start und beim Einschalten der Automatik wird der
      Soll-Zustand neu berechnet, damit verpasste Schaltzeiten nachgeholt werden.
    mode: restart
    triggers:
      - trigger: time
        at: "05:00:00"
        id: zeit
      - trigger: time
        at: "22:00:00"
        id: zeit
      - trigger: sun
        event: sunrise
        offset: "01:00:00"
        id: zeit
      - trigger: sun
        event: sunset
        offset: "-02:00:00"
        id: zeit
      - trigger: state
        entity_id: input_boolean.weihnachtsbeleuchtung_automatik
        to: "on"
        id: zeit
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.weihnachtsbeleuchtung_automatik
        state: "on"
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - alias: Nach dem Start warten, bis Zigbee2MQTT und Govee wieder da sind
            delay: "00:01:00"
      - choose:
          - alias: Soll an
            conditions:
              - condition: time
                after: "05:00:00"
                before: "22:00:00"
              - condition: or
                conditions:
                  - alias: Wochenende oder Feiertag
                    condition: state
                    entity_id: binary_sensor.workday_sensor
                    state: "off"
                  - alias: Morgens bis Sonnenaufgang + 1 h
                    condition: sun
                    before: sunrise
                    before_offset: "01:00:00"
                  - alias: Abends ab Sonnenuntergang − 2 h
                    condition: sun
                    after: sunset
                    after_offset: "-02:00:00"
            sequence:
              - action: homeassistant.turn_on
                target:
                  label_id: weihnachtsbeleuchtung
                continue_on_error: true
        default:
          - action: homeassistant.turn_off
            target:
              label_id: weihnachtsbeleuchtung
            continue_on_error: true

  # Erinnerung Saisonende (UI-id weihnachtsbeleuchtung_erinnerung_saisonende):
  # ab 15.01.2027 täglich 09:00 Push aufs Pixel 9, solange die Automatik an ist.
  # Der Knopf "Automatik ausschalten" schaltet den input_boolean direkt aus.
  - id: weihnachtsbeleuchtung_erinnerung_saisonende
    alias: Weihnachtsbeleuchtung – Erinnerung Saisonende
    description: >-
      Erinnert Carsten ab dem 15.01.2027 täglich um 09:00 per Push daran, die
      Weihnachtsbeleuchtungs-Automatik abzuschalten, solange sie noch an ist. Der
      Knopf in der Meldung schaltet die Automatik direkt aus.
    mode: single
    triggers:
      - trigger: time
        at: "09:00:00"
        id: erinnerung
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: WEIHNACHTSBELEUCHTUNG_AUS
        id: knopf
    conditions:
      - condition: state
        entity_id: input_boolean.weihnachtsbeleuchtung_automatik
        state: "on"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: knopf
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.weihnachtsbeleuchtung_automatik
          - conditions:
              - condition: trigger
                id: erinnerung
              - alias: Ab 15.01.2027
                condition: template
                value_template: "{{ now().date() >= as_datetime('2027-01-15').date() }}"
            sequence:
              - action: notify.mobile_app_pixel_9
                data:
                  title: Weihnachtsbeleuchtung
                  message: >-
                    Mitte Januar: Soll die Weihnachtsbeleuchtungs-Automatik aus? (Die
                    Deko schaltet dann nicht mehr nach Zeitplan.)
                  data:
                    tag: weihnachtsbeleuchtung_saisonende
                    actions:
                      - action: WEIHNACHTSBELEUCHTUNG_AUS
                        title: Automatik ausschalten

  # Außen nach Dunkelheit (UI-id weihnachtsbeleuchtung_aussen_dunkelheit).
  # Threshold-Helfer "Garten dunkel" in der UI anlegen (Helfer > Schwellenwert):
  #   Sensor sensor.hmip_slo_000d60c9a905f8_hochste_beleuchtungsstarke, Unterer
  #   Grenzwert 325, Hysterese 25, entity_id danach auf binary_sensor.garten_dunkel.
  - id: weihnachtsbeleuchtung_aussen_dunkelheit
    alias: Weihnachtsbeleuchtung außen – Dunkelheit
    description: >-
      Schaltet alles mit dem Label „Weihnachtsbeleuchtung außen“ (Gartenlicht
      H702A) zwischen 05:00 und 22:00 an, solange es im Garten dunkel ist
      (binary_sensor.garten_dunkel, Lichtsensor Terrasse: an unter 300 lx, aus über
      350 lx), sonst aus – an jedem Tag gleich. Fällt der Lichtsensor aus, gilt Sonne
      unter dem Horizont. Rechnet nach dem HA-Start neu.
    mode: restart
    triggers:
      - trigger: state
        entity_id: binary_sensor.garten_dunkel
        to: "on"
        for: "00:05:00"
        id: zeit
      - trigger: state
        entity_id: binary_sensor.garten_dunkel
        to: "off"
        for: "00:05:00"
        id: zeit
      - trigger: time
        at: "05:00:00"
        id: zeit
      - trigger: time
        at: "22:00:00"
        id: zeit
      - trigger: state
        entity_id: input_boolean.weihnachtsbeleuchtung_automatik
        to: "on"
        id: zeit
      - trigger: homeassistant
        event: start
        id: start
    conditions:
      - condition: state
        entity_id: input_boolean.weihnachtsbeleuchtung_automatik
        state: "on"
    actions:
      - if:
          - condition: trigger
            id: start
        then:
          - alias: Nach dem Start warten, bis Lichtsensor und Govee wieder da sind
            delay: "00:01:00"
      - choose:
          - alias: Soll an
            conditions:
              - condition: time
                after: "05:00:00"
                before: "22:00:00"
              - condition: or
                conditions:
                  - alias: Garten dunkel
                    condition: state
                    entity_id: binary_sensor.garten_dunkel
                    state: "on"
                  - alias: Lichtsensor weg, dann nach Sonne
                    condition: and
                    conditions:
                      - condition: state
                        entity_id: binary_sensor.garten_dunkel
                        state:
                          - unavailable
                          - unknown
                      - condition: state
                        entity_id: sun.sun
                        state: below_horizon
            sequence:
              - action: homeassistant.turn_on
                target:
                  label_id: weihnachtsbeleuchtung_aussen
                continue_on_error: true
        default:
          - action: homeassistant.turn_off
            target:
              label_id: weihnachtsbeleuchtung_aussen
            continue_on_error: true
