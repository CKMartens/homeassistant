# =============================================================================
# Wohnbereich – LED Deko Zweig (Elke) per Broadlink-IR
# Stand: 2026-10-14, offline vorbereitet (noch NICHT in HA eingespielt)
#   automation.wohnbereich_deko_zweig_zeitsteuerung (id: wohnbereich_deko_zweig_zeitsteuerung)
#   script.wohnbereich_deko_zweig_an / script.wohnbereich_deko_zweig_aus
#   input_boolean.wohnbereich_deko_zweig
#
# Nutzung:
#   a) als Package: Datei nach /config/packages/ legen
#      (configuration.yaml: homeassistant: packages: !include_dir_named packages)
#   b) oder die Blöcke einzeln in die UI kopieren
#      (Helper anlegen, Skript-/Automations-Editor -> "In YAML bearbeiten")
#
# Ablauf:
#   Werktag 05:00, Wochenende/Feiertag 06:00 -> an (nur wenn jemand zuhause ist)
#   Alle weg (zone.home = 0 für 5 min) oder 00:00 -> aus
#   Heimkommen zwischen Einschaltzeit und 24:00 -> an
#   "An" = IR "An", 3 s warten, IR "Prog8" (sonst blinkt der Zweig)
#   Details: docs/deko_zweig.md
#
# Abhängigkeit: Workday-Integration (binary_sensor.workday_sensor, Land DE,
#   Bundesland passend). Fehlt der Sensor, gilt Mo–Fr als Werktag (ohne Feiertage).
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Helper: Zustand merken (IR hat keine Rückmeldung)
# -----------------------------------------------------------------------------
input_boolean:
  wohnbereich_deko_zweig:
    name: "Deko Zweig an"
    icon: mdi:pine-tree

# -----------------------------------------------------------------------------
# 2) Skripte – auch für Dashboard-Buttons nutzbar
# -----------------------------------------------------------------------------
script:
  wohnbereich_deko_zweig_an:
    alias: "Wohnbereich – Deko Zweig an"
    description: >-
      Schaltet den LED Deko Zweig per Broadlink-IR ein und stellt direkt
      Programm 8 ein, damit er nicht blinkt.
    mode: single
    icon: mdi:pine-tree
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.ir_remote_wohnbereich
        data:
          device: "LED Deko Zweig"
          command: "An"
      - delay:
          seconds: 3
      - action: remote.send_command
        target:
          entity_id: remote.ir_remote_wohnbereich
        data:
          device: "LED Deko Zweig"
          command: "Prog8"
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wohnbereich_deko_zweig

  wohnbereich_deko_zweig_aus:
    alias: "Wohnbereich – Deko Zweig aus"
    description: Schaltet den LED Deko Zweig per Broadlink-IR aus.
    mode: single
    icon: mdi:pine-tree-variant-outline
    sequence:
      - action: remote.send_command
        target:
          entity_id: remote.ir_remote_wohnbereich
        data:
          device: "LED Deko Zweig"
          command: "Aus"
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wohnbereich_deko_zweig

# -----------------------------------------------------------------------------
# 3) Automation
# -----------------------------------------------------------------------------
automation:
  - id: wohnbereich_deko_zweig_zeitsteuerung
    alias: "Wohnbereich – Deko Zweig Zeitsteuerung"
    description: >-
      Schaltet Elkes LED Deko Zweig werktags um 05:00 und am Wochenende bzw.
      an Feiertagen um 06:00 ein, beim Heimkommen bis Mitternacht wieder ein,
      und aus, sobald alle weg sind oder spätestens um 24:00.
    mode: queued
    max: 3

    triggers:
      - trigger: time
        at: "05:00:00"
        id: morgens_werktag
      - trigger: time
        at: "06:00:00"
        id: morgens_frei
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
        id: heimkommen
      - trigger: state
        entity_id: zone.home
        to: "0"
        for: "00:05:00"
        id: alle_weg
      - trigger: time
        at: "00:00:00"
        id: mitternacht

    variables:
      werktag: >-
        {% if has_value('binary_sensor.workday_sensor') %}
          {{ is_state('binary_sensor.workday_sensor', 'on') }}
        {% else %}
          {{ now().isoweekday() <= 5 }}
        {% endif %}
      einschaltzeit: "{{ '05:00' if werktag else '06:00' }}"
      jemand_da: "{{ states('zone.home') | int(0) > 0 }}"

    actions:
      - choose:
          - alias: "Morgens an (passende Uhrzeit, jemand zuhause)"
            conditions:
              - condition: template
                value_template: >-
                  {{ jemand_da and
                     ((trigger.id == 'morgens_werktag' and werktag) or
                      (trigger.id == 'morgens_frei' and not werktag)) }}
            sequence:
              - action: script.wohnbereich_deko_zweig_an

          - alias: "Heimkommen: an, wenn nach Einschaltzeit und noch aus"
            conditions:
              - condition: trigger
                id: heimkommen
              - condition: state
                entity_id: input_boolean.wohnbereich_deko_zweig
                state: "off"
              - condition: template
                value_template: "{{ now().strftime('%H:%M') >= einschaltzeit }}"
            sequence:
              - action: script.wohnbereich_deko_zweig_an

          - alias: "Alle weg oder Mitternacht: aus"
            conditions:
              - condition: trigger
                id:
                  - alle_weg
                  - mitternacht
            sequence:
              # Bewusst ohne Zustandsprüfung: falls der Zweig per Fernbedienung
              # angemacht wurde, geht er trotzdem aus.
              - action: script.wohnbereich_deko_zweig_aus
