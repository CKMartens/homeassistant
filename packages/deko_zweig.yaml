# =============================================================================
# Wohnbereich – LED Deko Zweig (Elke): Steckdose + Broadlink-IR
# Stand: 2026-10-21, offline vorbereitet (Umbau auf Steckdose, noch NICHT in HA)
#   automation.wohnbereich_deko_zweig_zeitsteuerung (id: wohnbereich_deko_zweig_zeitsteuerung)
#   script.wohnbereich_deko_zweig_an / script.wohnbereich_deko_zweig_aus
#
# Nutzung:
#   a) als Package: Datei nach /config/packages/ legen
#      (configuration.yaml: homeassistant: packages: !include_dir_named packages)
#   b) oder die Blöcke einzeln in die UI kopieren
#      (Skript-/Automations-Editor -> "In YAML bearbeiten")
#
# Ablauf:
#   Ein/Aus über switch.wohnbereich_steckdose_deko (Strom an = Zweig an)
#   Steckdose geht an (egal wodurch) -> nach 3 s IR "Prog8" (sonst blinkt er)
#   Werktag 05:00, Wochenende/Feiertag 06:00 -> an (nur wenn jemand zuhause ist)
#   Alle weg (zone.home < 1 für 5 min) oder 00:00 -> aus
#   Heimkommen zwischen Einschaltzeit und 24:00 -> an
#   Details: docs/deko_zweig.md
#
# Abhängigkeit: Workday-Integration (binary_sensor.workday_sensor, Land DE,
#   Bundesland passend). Fehlt der Sensor, gilt Mo–Fr als Werktag (ohne Feiertage).
#
# Umbau 2026-10-21: input_boolean.wohnbereich_deko_zweig entfällt, der Zustand
#   kommt jetzt von der Steckdose. Helper in HA löschen, falls per UI angelegt.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Skripte – auch für Dashboard-Buttons nutzbar
# -----------------------------------------------------------------------------
script:
  wohnbereich_deko_zweig_an:
    alias: "Wohnbereich – Deko Zweig an"
    description: >-
      Schaltet die Steckdose des LED Deko Zweigs ein; Prog8 sendet danach
      die Zeitsteuerungs-Automation, sobald die Steckdose an ist.
    mode: single
    icon: mdi:pine-tree
    sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.wohnbereich_steckdose_deko

  wohnbereich_deko_zweig_aus:
    alias: "Wohnbereich – Deko Zweig aus"
    description: Schaltet die Steckdose des LED Deko Zweigs aus.
    mode: single
    icon: mdi:pine-tree-variant-outline
    sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.wohnbereich_steckdose_deko

# -----------------------------------------------------------------------------
# 2) Automation
# -----------------------------------------------------------------------------
automation:
  - id: wohnbereich_deko_zweig_zeitsteuerung
    alias: "Wohnbereich – Deko Zweig Zeitsteuerung"
    description: >-
      Schaltet Elkes LED Deko Zweig über seine Steckdose werktags um 05:00 und
      am Wochenende bzw. an Feiertagen um 06:00 ein, beim Heimkommen bis
      Mitternacht wieder ein, und aus, sobald alle weg sind oder spätestens um
      24:00; nach jedem Einschalten der Steckdose kommt per IR Prog8, damit er
      nicht blinkt.
    mode: queued
    max: 3

    triggers:
      - trigger: time
        at: "05:00:00"
        id: morgens_werktag
      - trigger: time
        at: "06:00:00"
        id: morgens_frei
      - trigger: numeric_state
        entity_id: zone.home
        above: 0
        id: heimkommen
      - trigger: numeric_state
        entity_id: zone.home
        below: 1
        for: "00:05:00"
        id: alle_weg
      - trigger: time
        at: "00:00:00"
        id: mitternacht
      - trigger: state
        entity_id: switch.wohnbereich_steckdose_deko
        to: "on"
        for: "00:00:03"
        id: steckdose_an

    variables:
      werktag: >-
        {% if has_value('binary_sensor.workday_sensor') %}
          {{ is_state('binary_sensor.workday_sensor', 'on') }}
        {% else %}
          {{ now().isoweekday() <= 5 }}
        {% endif %}
      einschaltzeit: "{{ '05:00' if werktag else '06:00' }}"
      jemand_da: "{{ states('zone.home') | int(0) > 0 }}"

    actions:
      - choose:
          - alias: "Morgens an (passende Uhrzeit, jemand zuhause)"
            conditions:
              - condition: template
                value_template: >-
                  {{ jemand_da and
                     ((trigger.id == 'morgens_werktag' and werktag) or
                      (trigger.id == 'morgens_frei' and not werktag)) }}
            sequence:
              - action: script.wohnbereich_deko_zweig_an

          - alias: "Heimkommen: an, wenn nach Einschaltzeit und Steckdose aus"
            conditions:
              - condition: trigger
                id: heimkommen
              - condition: state
                entity_id: switch.wohnbereich_steckdose_deko
                state: "off"
              - condition: template
                value_template: "{{ now().strftime('%H:%M') >= einschaltzeit }}"
            sequence:
              - action: script.wohnbereich_deko_zweig_an

          - alias: "Alle weg oder Mitternacht: aus"
            conditions:
              - condition: trigger
                id:
                  - alle_weg
                  - mitternacht
            sequence:
              - action: script.wohnbereich_deko_zweig_aus

          - alias: "Steckdose ist an (egal wodurch): Prog8 senden"
            conditions:
              - condition: trigger
                id: steckdose_an
            sequence:
              - action: remote.send_command
                target:
                  entity_id: remote.ir_remote_wohnbereich
                data:
                  device: "LED Deko Zweig"
                  command: "Prog8"
